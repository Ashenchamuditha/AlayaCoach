# =============================================
# SERVER
# =============================================
server.port=8081

# =============================================
# DATABASE - PostgreSQL
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/AlayaCoach
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# =============================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# =============================================
# GROQ AI API
# =============================================
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:NO_KEY}
groq.api.model=llama-3.3-70b-versatile

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:8081,http://localhost:3000,http://localhost:4173,https://alaya-coach.vercel.app}

# =============================================
# LOGGING
# =============================================
logging.level.com.alaya=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# =============================================
# MAIL / SMTP / RESEND
# =============================================
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:NO_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# RESEND HTTP API CONFIG
resend.api.key=${RESEND_API_KEY:re_N8X8B9Sj_P5H9p4m7Y5kL9q2n4S5V3T6R}
resend.api.url=https://api.resend.com/emails
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
