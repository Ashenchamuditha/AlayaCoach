# =============================================
# SERVER
# =============================================
server.port=8080

# =============================================
# DATABASE - PostgreSQL
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/AlayaCoach
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# =============================================
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
app.jwt.expiration-ms=86400000

# =============================================
# GROQ AI API
# =============================================
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=your_groq_api_key_here
groq.api.model=llama3-8b-8192

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:8081,http://localhost:3000,http://localhost:4173

# =============================================
# LOGGING
# =============================================
logging.level.com.alaya=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
